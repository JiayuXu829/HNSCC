[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "trust-hn"
version = "0.1.0"
description = "Reliability-gated prognostic modeling for head and neck cancer"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Code license to be selected before public release; datasets retain source licenses." }
authors = [{ name = "TRUST-HN investigators" }]
dependencies = [
  "numpy==2.3.2",
  "pandas==2.3.1",
  "pyarrow==21.0.0",
  "PyYAML==6.0.2",
  "scikit-learn==1.7.1",
  "scipy==1.16.1",
  "lifelines==0.30.0",
  "matplotlib==3.10.5",
  "seaborn==0.13.2",
  "requests==2.32.4",
  "tqdm==4.67.1",
  "rdata==1.1.0",
  "xarray==2026.7.0",
]

[project.optional-dependencies]
survival = [
  "scikit-survival==0.25.0",
  "xgboost==3.0.3",
]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.8",
]

[project.scripts]
trust-hn-audit = "trust_hn.data.audit:main"
trust-hn-locked-eval = "trust_hn.governance:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trust_hn"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]