adaptation_boundary:
  exact_original_reproduction: false
  rationale: Original methods use imaging or seven-modality inputs not available in the frozen blood-ICD-TMA evidence contract.
  retained_principles:
    EARLY_FUSION: availability-aware concatenation before a shared survival head
    LATE_FUSION: averaging independently supervised modality-specific hazard logits over available inputs
    MASKED_ATTENTION: learned attention over available modality embeddings without alignment
    BILINEAR_FUSION: low-rank pairwise interactions among available modality embeddings
    RUFFINI2026: frozen modality encoders followed by mask-aware intermediate fusion
    HAF2026: detached prognostic encoders, global latent alignment, and monotonic mask-robust fusion
  outcome_head: censoring-aware discrete hazards at the shared 24-month estimand
