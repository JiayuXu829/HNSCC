  dtype: float64
  optimizer: Adam
  learning_rate: 0.003
  weight_decay: 0.0001
  gradient_clip_norm: 5.0
  batching: full_outer_or_inner_training_fold
  loss: mean_negative_Breslow_Cox_plus_residual_score_L2
  deterministic_algorithms: true
  checkpoint_writing: false
absolute_risk:
  method: training_fold_Breslow_baseline_hazard
  training_outcomes_only: true
  validation_outcomes_used: false
