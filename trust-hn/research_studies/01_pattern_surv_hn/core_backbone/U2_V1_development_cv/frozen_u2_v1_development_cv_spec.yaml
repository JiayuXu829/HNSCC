    blood: 32
    icd: 80
    tma: 8
inner_selection:
  objective: minimum_mean_inner_fold_IPCW_Brier_at_730_5_days
  secondary: maximum_mean_inner_fold_Uno_C
  deterministic_tie_breakers:
  - larger_residual_penalty
  - fewer_optimization_steps
  residual_penalty_grid:
  - 0.01
  - 0.1
  checkpoint_steps:
  - 0
  - 25
  - 50
  - 100
  - 200
  architecture_search_allowed: false
  broad_sweep_allowed: false
