  reuse_outer_fold_selected_candidate: true
  refit_inside_each_training_fold: true
  validation_outcomes_used_for_anchor_fit: false
cross_fitting:
  outer_folds: 5
  outer_repetition_seeds:
  - 17
  - 29
  - 43
  - 71
  - 101
  inner_folds: 3
  stratification: event_indicator_only
  patient_prediction_coverage_per_seed: exactly_once
