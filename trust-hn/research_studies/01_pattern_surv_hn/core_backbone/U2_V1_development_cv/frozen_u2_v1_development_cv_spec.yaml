  model: Clinical_Residual_Deep_Sets_Cox
  parameter_count: 3225
  pooling: masked_mean
  residual_formula: eta_fused_equals_eta_clinical_plus_delta_eta
  zero_initialize_final_residual_head: true
  exact_empty_set_fallback: true
modality_inputs:
