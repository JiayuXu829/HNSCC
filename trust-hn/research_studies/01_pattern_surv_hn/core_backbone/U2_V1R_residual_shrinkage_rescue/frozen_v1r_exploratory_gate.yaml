schema_version: '0.1'
study_id: pattern_surv_hn
stage: U2/V1R_post_hoc_exploratory_rescue_gate
status: FROZEN_BEFORE_RESCUE_EXECUTION
frozen_on: '2026-08-19'
analysis_label: post_hoc_exploratory_rescue
delta_convention: candidate_minus_V0
coverage_gate:
  required_V0_coverage: 1.0
  required_V1_coverage: 1.0
  tolerance: 0.0
structural_gate:
  exact_empty_set_residual_max_abs_error: 0.0
  exact_clinical_fallback_max_abs_error: 0.0
  parameter_ceiling: 50000
safety_gate:
  mean_delta_IPCW_Brier_24m_maximum: 0.005
  supported_pattern_worst_Brier_regret_maximum: 0.02
  mean_absolute_CITL_deterioration_maximum: 0.1
  mean_absolute_calibration_slope_error_deterioration_maximum: 0.15
incremental_value_gate:
  relaxation_relative_to_original:
    probability_error_effect_size: from_minus_0_002_to_strictly_below_0
    discrimination_effect_size: from_plus_0_01_to_plus_0_005
    reason: exploratory_rescue_signal_detection_not_confirmatory_promotion
  qualifying_paths:
    - name: probability_error
      mean_delta_IPCW_Brier_24m_maximum: 0.0
      required_seed_direction: delta_IPCW_Brier_24m_less_than_0
      minimum_supporting_seeds: 3
    - name: discrimination
      mean_delta_Uno_C_24m_minimum: 0.005
      required_seed_direction: delta_Uno_C_24m_greater_than_0
      minimum_supporting_seeds: 3
  at_least_one_path_required: true
decision_rule:
  V1R_EARNS_COMPLEXITY: exploratory_rescue_signal_only
  V1R_DOES_NOT_EARN_COMPLEXITY: no_exploratory_rescue_signal
  original_U2_decision_override_allowed: false
claim_boundary:
  supports_if_passed: >-
    Post-hoc internal development evidence that an inner-selected shrunken V1 residual is safe and
    shows a small directional incremental signal under the explicitly relaxed exploratory gate.
  does_not_support:
    - original_frozen_U2_gate_pass
    - confirmatory_superiority
    - official_test_confirmation
    - external_generalization
    - transportability
    - clinical_utility
