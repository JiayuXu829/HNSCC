schema_version: '0.1'
stage: U5R10_FIXED_BRIDGE_EXTERNAL_SECONDARY_CHARACTERIZATION
status: FROZEN_BEFORE_EXECUTION
frozen_on: '2026-08-27'
analysis_label: locked_secondary_post_unseal_external_characterization
purpose: >-
  Apply the previously frozen U5R7 beta=0.90 log-loss bridge without any parameter
  re-estimation to the two available GEO cohorts, to characterize whether its
  calibration direction is reproducible outside HANCOCK.
important_definition_boundary: >-
  The available GEO prediction artifacts are generated by the legacy Phase 6 B6
  fusion pipeline and are not demonstrably identical to the current PATTERN-Surv-HN
  V1R input contract. This stage is therefore not confirmation of the current V1R
  bridge; it is a transportability characterization of a fixed monotone transform
  applied to the legacy B6 fusion risk.
cohorts:
  - id: GSE65858
    role: external_test_post_unseal_characterization
    expected_n: 244
  - id: GSE41613
    role: sensitivity_external_post_unseal_characterization
    expected_n: 97
backbone:
  prediction_artifact: results/predictions/phase6/{cohort_lower}__original__aggregate100.csv
  base_column: b6_risk
  base_definition: legacy Phase 6 B6 fusion risk
  current_v1r_compatibility: not_demonstrated
bridge:
  source: research_studies/01_pattern_surv_hn/core_backbone/U5R7_V1R_beta09_logloss_bridge_candidate/selected_bridge_parameters.csv
  formula: p_bridge = sigmoid(alpha_dev_mean + beta * logit(p_base))
  alpha_dev_mean: -0.14503379856995471
  beta: 0.90
  strictly_monotone: true
  ranking_preservation: exact_for_finite_scores
  outcome_dependent_refit: false
estimands:
  primary:
    - delta_ipcw_brier_bridge_minus_raw
  secondary:
    - citl_raw_and_bridge
    - absolute_citl_error_change
    - calibration_slope_raw_and_bridge
    - absolute_slope_error_change
    - ranking_preservation
    - coverage_preservation
    - patient_level_stratified_bootstrap_intervals
metrics:
  horizon_days: 730.5
  censoring_estimator: cohort_internal_kaplan_meier_ipcw
  bootstrap_replicates: 2000
  bootstrap_seed: 20260827
  stratification: event_status
  all_cohorts_and_fixed_result_reported: true
freeze_rules:
  no_alpha_refit: true
  no_beta_selection: true
  no_cohort_selection_after_readout: true
  no_favourable_subset_reporting: true
  no_patient_removal: true
  no_current_v1r_prediction_modification: true
  no_router_training: true
  no_deployment_claim: true
interpretation:
  positive_external_signal: >-
    A negative delta IPCW Brier, reduced absolute CITL error, and reduced absolute
    slope error on both cohorts support a reproducible calibration direction for the
    legacy B6 transport characterization.
  claim_limit: >-
    This does not establish external validity of the current V1R bridge because the
    GEO prediction definition is not proven equivalent to current V1R.
required_artifacts:
  - frozen_u5r10_fixed_bridge_external_protocol.yaml
  - u5r10_external_aggregate_results.json
  - u5r10_external_cohort_results.csv
  - u5r10_external_bootstrap_results.csv
  - u5r10_external_audit.md
  - u5r10_external_hashes.json
