    interpretation_if_failed: observable_gating_features_do_not_safely_select_incremental_experts
  - order: 4
    id: R4_CC_RST
    name: Clinical_Conditioned_Residual_Set_Transformer
    role: conditional_cross_modality_interaction_candidate
    neural_network: true
    provisional_parameter_ceiling: 50000
    core_design:
